<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 9º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho do Boletim -->
  <header>
    <h1>Boletim Digital</h1>
    <p class="subtitulo">9º Ano - Ensino Fundamental</p>
    <p class="estudante">Estudante: <strong>Estudante Exemplo</strong></p>
  </header>

  <main>
    <!-- Área de Cards de Resumo -->
    <section class="cards-container">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="media-geral" class="destaque-card">--</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="total-faltas" class="destaque-card">--</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="bom-desempenho" class="destaque-card">--</p>
      </div>

      <div class="card">
        <h3>Precisam de Atenção</h3>
        <p id="precisa-atencao" class="destaque-card">--</p>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="frequencia-geral" class="destaque-card">92%</p>
        <span class="tag-frequencia">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de Notas e Faltas -->
    <section class="tabela-container">
      <h2>Notas e Faltas por Disciplina</h2>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabela-boletim">
            <!-- As 15 linhas serão preenchidas automaticamente pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
